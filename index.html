 <div class="grid">${t[5].map((x,k)=>`<button class="fl" aria-label="مثال ${k+1}"><div class="in"><div class="f"><small>مثال ${k+1}</small><div style="font-weight:700">${e(x[0])}</div><small>↺ اضغط لعرض الحل</small></div><div class="b"><small>الحل</small><pre>${e(x[1])}</pre></div></div></button>`).join('')}</div>`;

}
